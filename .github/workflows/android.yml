name: Build Android APK

on:
  push:
    branches:
      - main
      - claude/android-tank-game-touch-vhmbpl
    paths:
      - "tank-battle-android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tank-battle-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk steel-thunder.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-thunder-apk
          path: tank-battle-android/steel-thunder.apk
          if-no-files-found: error

      # A rolling pre-release gives the phone a stable, tap-to-download URL.
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest steel-thunder.apk \
            --title "Steel Thunder — latest Android build" \
            --prerelease \
            --notes "Debug-signed APK, built from \`${GITHUB_SHA::7}\`.

          Install: download on the phone, allow *Install unknown apps* for your browser, open the file.
          Landscape only. No network permission — everything runs offline."
